{% extends 'base.html' %}
{% block title %} login {% endblock %}
{% block content %}






<div class="container mt-5 mt-5 pt-5 mb-5 pb-5">
  <div class="stack mx-auto p-2">
    <div class="card-l c1">Design</div>
    <div class="card-l c2">Build</div>
    <div class="card-l c3">Ship</div>
  </div>
</div>



<div class="container   w-25  mb-5 pb-5">
  <form action="/login" methods="post">
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Email address</label>
      <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="email">
    </div>
    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Password</label>
      <input type="password" class="form-control" id="exampleInputPassword1" name="password">
    </div>

    <button type="submit" class="btn btn-primary">Login</button>
  </form>

  <p>Dont have an account? <a href="/register"> Register here</button></a></p>
</div>

{% endblock %}
