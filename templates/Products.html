{% extends 'base.html' %} {% block title %} products {% endblock %} {% block
content %}

<div class="container-fluid mt-5 p-5">this is the projects page</div>

<div class="container">
  

  <div class="container-fluid mt-5">
    <div class="row g-2 products">
      
      <!-- render shirts here -->
      
    </div>    
  </div>

<!--cart here-->
  <form action="/make_sale" method="post">
  <div class="container cart">
    <table class="table">
      <thead>
        <div class="cart-header">
          <tr>
            <th scope="col">#</th>
            <th scope="col">
              <div class="column1">Item</div>
            </th>
            <th scope="col">
              <div class="column2">Unit price</div>
            </th>
            <th scope="col">
              <div class="column3">Units</div>
            </th>
          </tr>
        </div>
      </thead>
      
      <tbody class="cart-items" >
        
        <!-- render cart item <tr> rows here -->
        
      </tbody>
      
      <tfoot>
        <tr>
          <th>
            <p>Totals</p>
          </th>
          <td>
            <div class="cart-footer">
              <div class="subtotal">Subtotal (0 items): $0</div>
            </div>
          </td>
          <td>
            <div class="cart-footer">
              
              
              <button type="submit" class="checkout">Proceed to checkout</button>
            </div>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>
  </form>

</div>


<!-- Button trigger modal -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
  <h5>make sale</h5>
</button>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Purchase product</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <select class="form-select" aria-label="Default select example">
          <option selected>Open this select menu</option>
          <option value="1">One</option>
          <option value="2">Two</option>
          <option value="3">Three</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>

{% endblock %}
